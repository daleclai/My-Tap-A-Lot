<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
</head>

<body>

<header>
    <h1>Settings</h1>
    <p>
        🪙 Scores: <span id="countscore">0</span>
    </p>
    <a href="index.html">Return</a>
</header>

<main>
    <p>Create an account to save your taps!</p>

    <form>
        <ul>
            <li>
                <label for="email">Email:</label>
                <input type="email" id="email" name="varEmail" required>
            </li>

            <li>
                <label for="password">Password:</label>
                <input type="password" id="password" name="varPassword" required>
            </li>
        </ul>

        <button type="submit" class="submit">Login</button>
        <button type="button" class="submit">Create</button>
    </form>
</main>

</body>
</html>
