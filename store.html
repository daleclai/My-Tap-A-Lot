<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Store</title>
    <link rel="stylesheet" href="store_style.css" />
</head>

<body>
    <div class="storebody">
        <div class="storeheader">
            <header>
                <h1>Store</h1>
            </header>
        </div>

    <div class="points_available">
        <p>
            🪙 Scores: <span id="countscore">0</span>
        </p>
    </div>

        <div class="buy_buttons">
            <h2>Button Skins</h2>
            <div class="btn_items">
                <button class="options">
                    <div class="base">
                        <div class="blue_button"></div>
                    </div>
                    100
                </button>

                <button class="options">
                    <div class="base">
                        <div class="neon_button"></div>
                    </div>
                    200
                </button>

                <button class="options">
                    <div class="base">
                        <div class="gold_button"></div>
                    </div>
                    300
                </button>
                <button class="options">
                    <div class="base">
                        <div class="fire_button"></div>
                    </div>
                    500
                </button>
            </div>
        </div>

        <div class="buy_backgrounds">
            <h2>Backgrounds</h2>
            <div class="back_options">
                <button class="options">
                        <div class="forest_background"></div>
                    1000
                </button>
                <button class="options">
                    <div class="beach_background"></div>
                    2000
                </button>
                <button class="options">
                    <div class="space_background"></div>
                    3000
                </button>
                <button class="options">
                    <div class="city_background"></div>
                    5000
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">

        <a href="index.html">
            <button class="nav tap">
                <img src="https://marketplace.canva.com/TuY5k/MAG9P5TuY5k/1/tl/canva-clicking-hand-icon-illustration-MAG9P5TuY5k.png" alt="Clicking icon" width="80" height="80"> 
                <h2>Tap</h2> 
            </button>
        </a>

        <a href="store.html">
            <button class="nav store">
                <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png" alt="Store icon" width="80" height="80">
                <h2>Store</h2>
            </button>
        </a>

        <a href="rankings.html">
            <button class="nav ranking">
                <img src="https://cdn-icons-png.flaticon.com/512/9143/9143368.png" alt="Ranking icon" width="80" height="80">
                <h2>Ranking</h2>
            </button>
        </a>
    </nav>

    <footer>
        <p>Claire Daley</p>
        <p><a href="https://github.com/daleclai/My-Tap-A-Lot.git">GitHub</a></p>
    </footer>
</body>
</html>
